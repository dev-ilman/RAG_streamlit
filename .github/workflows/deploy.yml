name: Deploy

# Images are built and pushed on every green main build; the Azure release step
# only runs when the Azure secrets are present, so a fork can use this workflow
# for images alone without any cloud account.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [production]
        default: production

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build and publish images
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-azure:
    name: Release to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push
    # Skipped automatically when the repository has no Azure credentials.
    if: vars.AZURE_RESOURCE_GROUP != ''
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out the new backend revision
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_BACKEND_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_PREFIX }}-backend:${{ needs.build-and-push.outputs.tag }}"

      - name: Roll out the new frontend revision
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_FRONTEND_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_PREFIX }}-frontend:${{ needs.build-and-push.outputs.tag }}"

      - name: Verify the deployment is healthy
        run: |
          URL="https://$(az containerapp show \
            --name '${{ vars.AZURE_FRONTEND_APP }}' \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --query properties.configuration.ingress.fqdn -o tsv)"
          echo "Checking ${URL}"
          for attempt in $(seq 1 20); do
            if curl -fsS "${URL}/api/v1/health/ready" | grep -q '"database":"ok"'; then
              echo "Deployment healthy at ${URL}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::deployment did not become healthy"
          exit 1
