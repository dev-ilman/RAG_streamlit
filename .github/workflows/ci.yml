name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      # The real engine, not SQLite: the suite exercises pgvector similarity
      # search, unique constraints, and cascade deletes.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      # No API key in CI: the deterministic provider covers the whole pipeline.
      LLM_PROVIDER: fake
      ENVIRONMENT: test
      SECRET_KEY: ci-secret-key-not-used-outside-this-job
      RATE_LIMIT_PER_MINUTE: "0"
      STORAGE_DIR: /tmp/rag-uploads

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Verify migrations apply to an empty database
        run: alembic upgrade head

      - name: Verify models and migrations agree
        run: |
          alembic check || {
            echo "::error::Models drift from migrations. Run: alembic revision --autogenerate"
            exit 1
          }

      - name: Tests
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm run test -- --run

      - name: Production build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: false
          load: true
          tags: rag-platform-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runtime
          push: false
          load: true
          tags: rag-platform-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4

      - name: Start the full stack
        run: |
          cp .env.example .env
          sed -i "s/^LLM_PROVIDER=.*/LLM_PROVIDER=fake/" .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Wait for the API to report ready
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost/api/v1/health/ready | grep -q '"database":"ok"'; then
              echo "stack is ready after ${attempt} attempts"
              exit 0
            fi
            sleep 3
          done
          echo "::error::stack did not become ready"
          docker compose -f docker-compose.prod.yml logs --tail 100
          exit 1

      - name: Register, ingest, and ask through the public entrypoint
        run: bash scripts/smoke.sh http://localhost

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
