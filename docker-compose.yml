# Local development stack: Postgres+pgvector, FastAPI (hot reload), Vite dev server.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      POSTGRES_HOST: db
      STORAGE_DIR: /app/data/uploads
      # A shell variable cannot override env_file, so route this one through
      # interpolation instead. Compose reads the same .env for substitution,
      # so `LLM_PROVIDER=fake docker compose up` wins, a value in .env is
      # honoured when the shell says nothing, and gemini is the fallback.
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      # Vite proxies /api to the backend, so the browser stays same-origin
      # and the httpOnly refresh cookie works without CORS credentials.
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres-data:
  backend-data:
